{{- if not .Values.secrets.existingSecret }}
{{- $name := include "opsmind.secretName" . }}
{{- /*
Reuse values from the live Secret so generated credentials survive upgrades. lookup returns an
empty map under `helm template` and --dry-run, where fresh random values are fine.
*/}}
{{- $prev := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $jwt := .Values.secrets.jwtSecret | default (get $prev "JWT_SECRET" | b64dec) | default (randAlphaNum 48) }}
{{- $token := .Values.secrets.aiServiceToken | default (get $prev "AI_SERVICE_TOKEN" | b64dec) | default (randAlphaNum 48) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "opsmind.labels" (dict "ctx" . "component" "config") | nindent 4 }}
  annotations:
    # Uninstall must not drop the password of a Postgres volume that outlives the release;
    # a reinstall under the same release name adopts this Secret again.
    helm.sh/resource-policy: keep
type: Opaque
data:
  JWT_SECRET: {{ $jwt | b64enc | quote }}
  AI_SERVICE_TOKEN: {{ $token | b64enc | quote }}
  {{- if .Values.postgresql.enabled }}
  {{- $pgPassword := .Values.secrets.postgresPassword | default (get $prev "POSTGRES_PASSWORD" | b64dec) | default (randAlphaNum 32) }}
  POSTGRES_PASSWORD: {{ $pgPassword | b64enc | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s" .Values.postgresql.auth.username $pgPassword (include "opsmind.postgresqlHost" .) .Values.postgresql.auth.database | b64enc | quote }}
  {{- else }}
  DATABASE_URL: {{ required "externalDatabase.url (or secrets.existingSecret) is required when postgresql.enabled=false" .Values.externalDatabase.url | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
