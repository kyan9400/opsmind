{{- $c := .Values.ai }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsmind.fullname" . }}-ai
  labels:
    {{- include "opsmind.labels" (dict "ctx" . "component" "ai") | nindent 4 }}
spec:
  {{- if not $c.autoscaling.enabled }}
  replicas: {{ $c.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "opsmind.selectorLabels" (dict "ctx" . "component" "ai") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opsmind.labels" (dict "ctx" . "component" "ai") | nindent 8 }}
      annotations:
        {{- include "opsmind.checksumAnnotations" . | nindent 8 }}
        {{- include "opsmind.scrapeAnnotations" (dict "ctx" . "port" $c.port) | nindent 8 }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "opsmind.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "opsmind.podSecurityContext" (dict "ctx" . "component" $c) | nindent 8 }}
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      containers:
        - name: ai
          image: {{ include "opsmind.image" (dict "ctx" . "image" $c.image) }}
          imagePullPolicy: {{ include "opsmind.imagePullPolicy" (dict "ctx" . "image" $c.image) }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", {{ $c.port | quote }}]
          ports:
            - name: http
              containerPort: {{ $c.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "opsmind.configMapName" . }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsmind.secretName" . }}
                  key: DATABASE_URL
            - name: AI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsmind.secretName" . }}
                  key: AI_SERVICE_TOKEN
            # Provider keys are optional: the offline hash/extractive providers need none.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsmind.secretName" . }}
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsmind.secretName" . }}
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: OTEL_SERVICE_NAME
              value: opsmind-ai
            # No passwd entry is needed for the UID; point library caches at the writable volume.
            - name: HOME
              value: /tmp
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
