{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opsmind.serviceAccountName" . }}
  labels:
    {{- include "opsmind.labels" (dict "ctx" . "component" "") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# None of the workloads talk to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
