{{- $c := .Values.worker }}
{{- $heartbeatProbe := printf "test $(( $(date +%%s) - $(stat -c %%Y /tmp/worker-heartbeat) )) -lt %d" (int $c.heartbeatMaxAgeSeconds) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsmind.fullname" . }}-worker
  labels:
    {{- include "opsmind.labels" (dict "ctx" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ $c.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "opsmind.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opsmind.labels" (dict "ctx" . "component" "worker") | nindent 8 }}
      annotations:
        {{- include "opsmind.checksumAnnotations" . | nindent 8 }}
        {{- include "opsmind.scrapeAnnotations" (dict "ctx" . "port" $c.metricsPort) | nindent 8 }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "opsmind.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "opsmind.podSecurityContext" (dict "ctx" . "component" $c) | nindent 8 }}
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          # Same image as the api; only the entrypoint differs.
          image: {{ include "opsmind.image" (dict "ctx" . "image" .Values.api.image) }}
          imagePullPolicy: {{ include "opsmind.imagePullPolicy" (dict "ctx" . "image" .Values.api.image) }}
          command: ["node", "dist/worker.js"]
          ports:
            - name: metrics
              containerPort: {{ $c.metricsPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "opsmind.configMapName" . }}
          env:
            {{- include "opsmind.nodeEnv" . | nindent 12 }}
            - name: WORKER_METRICS_PORT
              value: {{ $c.metricsPort | quote }}
            - name: WORKER_HEARTBEAT_FILE
              value: /tmp/worker-heartbeat
            - name: OTEL_SERVICE_NAME
              value: opsmind-worker
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # The worker has no HTTP API. It touches the heartbeat file every 5s only while connected
          # to Redis and running, so a stale file means it is wedged, not merely idle.
          startupProbe:
            exec:
              command: ["sh", "-c", {{ $heartbeatProbe | quote }}]
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec:
              command: ["sh", "-c", {{ $heartbeatProbe | quote }}]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
