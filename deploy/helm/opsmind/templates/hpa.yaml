{{- range $component := list "api" "ai" }}
{{- $c := index $.Values $component }}
{{- if $c.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "opsmind.fullname" $ }}-{{ $component }}
  labels:
    {{- include "opsmind.labels" (dict "ctx" $ "component" $component) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "opsmind.fullname" $ }}-{{ $component }}
  minReplicas: {{ $c.autoscaling.minReplicas }}
  maxReplicas: {{ $c.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $c.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    # Scale down slowly so a brief lull between ingestion bursts does not thrash pods.
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
{{- end }}
