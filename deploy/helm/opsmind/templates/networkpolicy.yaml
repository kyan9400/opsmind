{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "opsmind.fullname" . }}
{{- $metricsFrom := .Values.networkPolicy.metricsFrom }}
# Baseline: chart pods accept no traffic unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny
  labels:
    {{- include "opsmind.labels" (dict "ctx" . "component" "") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opsmind.selectorLabels" (dict "ctx" . "component" "") | nindent 6 }}
  policyTypes: [Ingress]
---
# Public entry points: reached through the ingress controller (or port-forward), from any namespace.
{{- range $component := list "api" "web" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-{{ $component }}
  labels:
    {{- include "opsmind.labels" (dict "ctx" $ "component" $component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opsmind.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ (index $.Values $component).port }}
          protocol: TCP
---
{{- end }}
# Internal-only: the AI service trusts callers by shared token, so also restrict it at the network layer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-ai
  labels:
    {{- include "opsmind.labels" (dict "ctx" . "component" "ai") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opsmind.selectorLabels" (dict "ctx" . "component" "ai") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "opsmind.selectorLabels" (dict "ctx" . "component" "api") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "opsmind.selectorLabels" (dict "ctx" . "component" "worker") | nindent 14 }}
      ports:
        - port: {{ .Values.ai.port }}
          protocol: TCP
    {{- with $metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.ai.port }}
          protocol: TCP
    {{- end }}
{{- with $metricsFrom }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-worker
  labels:
    {{- include "opsmind.labels" (dict "ctx" $ "component" "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opsmind.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.worker.metricsPort }}
          protocol: TCP
{{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-postgresql
  labels:
    {{- include "opsmind.labels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opsmind.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $component := list "api" "worker" "ai" }}
        - podSelector:
            matchLabels:
              {{- include "opsmind.selectorLabels" (dict "ctx" $ "component" $component) | nindent 14 }}
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "opsmind.labels" (dict "ctx" . "component" "redis") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opsmind.selectorLabels" (dict "ctx" . "component" "redis") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $component := list "api" "worker" }}
        - podSelector:
            matchLabels:
              {{- include "opsmind.selectorLabels" (dict "ctx" $ "component" $component) | nindent 14 }}
        {{- end }}
      ports:
        - port: 6379
          protocol: TCP
{{- end }}
{{- end }}
