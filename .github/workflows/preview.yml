name: Preview

# The static "interactive preview" of the web UI: the real stack answers once, scripts/record-preview.mjs
# records the answers, and the UI is exported as plain files that replay them in the browser (recorded
# data, no server). Published to SourceCraft Sites once the owner has set it up (deploy/sourcecraft/README.md);
# until then every run still builds, tests and uploads the site as an artifact.
on:
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Builds and tests with no secrets: npm install scripts, docker builds and next build all run here.
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The recorder asks up to 9 questions and pulls 4 insights and 2 exports as one user.
      AI_RATE_LIMIT: "0"
      DEMO_EMAIL: demo@opsmind.dev
      DEMO_PASSWORD: opsmind-demo
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/docker-hub-mirror
      - name: Start the stack
        run: docker compose up -d --build --wait postgres redis api ai worker
      - name: Seed the demo workspace
        run: docker compose exec -T -e DEMO_EMAIL=demo@opsmind.dev -e DEMO_PASSWORD=opsmind-demo api node dist/seedDemo.js
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Record the preview data (waits until the demo documents are indexed)
        run: node scripts/record-preview.mjs
      - name: Base path
        id: site
        env:
          SOURCECRAFT_REPO: ${{ vars.SOURCECRAFT_REPO }}
        # SourceCraft Sites serves a repository at https://<org>.sourcecraft.site/<repo>/, so the app lives under /<repo>.
        run: |
          repo="${SOURCECRAFT_REPO#*/}"
          echo "base_path=/${repo:-opsmind}" >> "$GITHUB_OUTPUT"
      - name: Build the static preview
        env:
          STATIC_PREVIEW: "1"
          NEXT_PUBLIC_PREVIEW: "1"
          PREVIEW_BASE_PATH: ${{ steps.site.outputs.base_path }}
        run: npm run build -w apps/web
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Smoke test the static site (banner, demo, analytics, ask, Arabic, no /api/ requests)
        env:
          PREVIEW_BASE_PATH: ${{ steps.site.outputs.base_path }}
        run: node apps/web/preview-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: interactive-preview
          path: apps/web/out/
          if-no-files-found: error
      - if: failure()
        run: docker compose logs --no-color api worker ai

  # The only job that sees the SourceCraft token. It runs no project code: it takes the tested site from
  # the artifact and pushes it with git, so nothing from the build can reach the token.
  publish:
    needs: preview
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy/sourcecraft
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: interactive-preview
          path: site
      # Secrets cannot be tested in `if:`, so the step checks them itself and skips with a notice.
      - name: Publish to SourceCraft Sites
        env:
          SOURCECRAFT_TOKEN: ${{ secrets.SOURCECRAFT_TOKEN }}
          SOURCECRAFT_REPO: ${{ vars.SOURCECRAFT_REPO }}
        run: |
          if [ -z "$SOURCECRAFT_TOKEN" ] || [ -z "$SOURCECRAFT_REPO" ]; then
            echo "::notice title=SourceCraft publish skipped::Add the secret SOURCECRAFT_TOKEN and the variable SOURCECRAFT_REPO (organization/repository) to publish, see deploy/sourcecraft/README.md. The built site is in the interactive-preview artifact."
            exit 0
          fi
          bash deploy/sourcecraft/publish.sh site
