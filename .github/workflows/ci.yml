name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:pg16 # Docker Hub image via Google's mirror (rate limits)
        env:
          POSTGRES_USER: opsmind
          POSTGRES_PASSWORD: opsmind
          POSTGRES_DB: opsmind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsmind" --health-interval 5s --health-retries 10
      redis:
        image: mirror.gcr.io/library/redis:7-alpine # Docker Hub image via Google's mirror (rate limits)
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://opsmind:opsmind@localhost:5432/opsmind_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-at-least-16-chars
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint -w apps/api
      - run: npm run migrate -w apps/api
      - run: npm test -w apps/api
        env: { INTEGRATION: "1" }
      - run: npm run build -w apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint -w apps/web
      - run: npm run build -w apps/web

  ai:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:pg16 # Docker Hub image via Google's mirror (rate limits)
        env:
          POSTGRES_USER: opsmind
          POSTGRES_PASSWORD: opsmind
          POSTGRES_DB: opsmind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsmind" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://opsmind:opsmind@localhost:5432/opsmind_test
    steps:
      - uses: actions/checkout@v5
      # The schema is owned by the API's migrations; apply them first.
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run migrate -w apps/api
        env: { JWT_SECRET: ci-secret-at-least-16-chars }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
        working-directory: services/ai
      - run: ruff check .
        working-directory: services/ai
      - run: pytest -q
        working-directory: services/ai
        env: { INTEGRATION: "1" }

  e2e:
    needs: [api, web, ai]
    runs-on: ubuntu-latest
    env:
      # One user drives every AI endpoint in smoke.sh; keep the per-user AI limit out of the way.
      AI_RATE_LIMIT: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/docker-hub-mirror
      - run: docker compose up -d --build --wait postgres redis api ai worker
      - run: bash scripts/smoke.sh
      - name: Demo workspace is seeded and read-only
        run: |
          docker compose exec -T -e DEMO_EMAIL=demo@opsmind.dev -e DEMO_PASSWORD=ci-demo-password api node dist/seedDemo.js
          # Idempotent: a second run must not fail or duplicate anything.
          docker compose exec -T -e DEMO_EMAIL=demo@opsmind.dev -e DEMO_PASSWORD=ci-demo-password api node dist/seedDemo.js
          TOKEN=$(curl -fsS -X POST localhost:4000/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"email":"demo@opsmind.dev","password":"ci-demo-password"}' | jq -r .token)
          AUTH="authorization: Bearer $TOKEN"
          curl -fsS localhost:4000/api/v1/auth/me -H "$AUTH" | jq -e '.role == "viewer"'
          curl -fsS "localhost:4000/api/v1/metrics/dashboard?days=30" -H "$AUTH" | jq -e '.kpis | length == 6'
          curl -fsS localhost:4000/api/v1/documents -H "$AUTH" | jq -e '.data | length == 4'
          # Visitors can look but not touch.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:4000/api/v1/metrics/demo -H "$AUTH")" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:4000/api/v1/documents -H "$AUTH" -F file=@README.md)" = 403
      - if: failure()
        run: docker compose logs --no-color api worker ai
      - run: docker compose build web

  observability:
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_IMAGE: prom/prometheus:v3.5.0 # keep in sync with docker-compose.observability.yml
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/docker-hub-mirror
        with:
          images: ${{ env.PROMETHEUS_IMAGE }}
      - name: promtool check config
        run: >-
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro"
          --entrypoint promtool "$PROMETHEUS_IMAGE"
          check config /etc/prometheus/prometheus.yml
      - name: promtool check rules
        run: >-
          docker run --rm -v "$PWD/ops/prometheus:/etc/prometheus:ro"
          --entrypoint promtool "$PROMETHEUS_IMAGE"
          check rules /etc/prometheus/alerts.yml
      - name: Validate Grafana dashboards
        run: |
          for f in ops/grafana/dashboards/*.json; do
            jq -e '.uid and .title and (.panels | length > 0)' "$f" > /dev/null
            # Datasources must be referenced by uid so provisioning stays portable.
            jq -e '[.. | objects | select(has("datasource")) | .datasource | select(type == "string")] | length == 0' "$f" > /dev/null
            echo "ok $f"
          done
      - name: Compose override is valid
        run: docker compose -f docker-compose.yml -f docker-compose.observability.yml config --quiet

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/docker-hub-mirror
        with:
          images: caddy:2.10-alpine
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      - run: terraform init -backend=false
        working-directory: infra/terraform/yandex
      - run: terraform validate
        working-directory: infra/terraform/yandex
      - name: Validate production compose override
        env:
          DOMAIN: ci.example.com
          POSTGRES_PASSWORD: ci-dummy-postgres-password
          JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef
          AI_SERVICE_TOKEN: ci-dummy-ai-token-0123
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: Validate Caddyfile
        run: >-
          docker run --rm -e DOMAIN=ci.example.com
          -v "$PWD/deploy/caddy:/etc/caddy:ro" caddy:2.10-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  load:
    needs: [api, web, ai]
    runs-on: ubuntu-latest
    env:
      # k6 runs 50 VUs with one token against ask/insights; the per-user AI limit would turn that into 429s.
      AI_RATE_LIMIT: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/docker-hub-mirror
      - run: docker compose up -d --build --wait postgres redis api ai worker
      - uses: grafana/setup-k6-action@v1
      # k6 exits non-zero only when a threshold fails; that is what should fail this job.
      - run: k6 run -e API=http://localhost:4000 -e DURATION_SCALE=0.3 load/k6/load.js
      - if: always()
        run: |
          if [ -f load/results/summary.md ]; then
            cat load/results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No load summary produced (setup likely failed)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-results
          path: load/results/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --no-color api worker ai

  kind:
    needs: [api, web, ai]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # Explicit bash adds -o pipefail, so a failing `helm template` can't hide behind kubeconform.
        shell: bash
    env:
      KUBECONFORM_VERSION: v0.6.7
      CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/docker-hub-mirror
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Install kubeconform
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint chart
        run: |
          helm lint deploy/helm/opsmind
          helm lint deploy/helm/opsmind -f deploy/kind/values-kind.yaml
      - name: Validate rendered manifests
        run: |
          validate() {
            helm template opsmind deploy/helm/opsmind "$@" \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -schema-location default -schema-location "$CRD_SCHEMAS"
          }
          validate
          validate -f deploy/kind/values-kind.yaml
          validate \
            --set ingress.enabled=true --set ingress.host=opsmind.example.com \
            --set metrics.serviceMonitor.enabled=true --set networkPolicy.enabled=true \
            --set postgresql.enabled=false --set externalDatabase.url=postgres://u:p@db:5432/opsmind \
            --set redis.enabled=false --set externalRedis.url=redis://cache:6379
      - name: Build images
        # api and web build from the repo root, so npm ci installs what package-lock.json pins.
        run: |
          docker build -t opsmind-api:ci -f apps/api/Dockerfile .
          docker build -t opsmind-ai:ci services/ai
          docker build -t opsmind-web:ci --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000 -f apps/web/Dockerfile .
      - uses: helm/kind-action@v1
        with:
          cluster_name: opsmind
          config: deploy/kind/kind-config.yaml
      - name: Load images into kind
        # Postgres and Redis too (fetched from the mirror above), so the cluster never asks Docker Hub.
        run: kind load docker-image opsmind-api:ci opsmind-ai:ci opsmind-web:ci pgvector/pgvector:pg16 redis:7-alpine --name opsmind
      - name: Deploy and run end-to-end tests
        run: bash scripts/kind-e2e.sh

  rag-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:pg16 # Docker Hub image via Google's mirror (rate limits)
        env:
          POSTGRES_USER: opsmind
          POSTGRES_PASSWORD: opsmind
          POSTGRES_DB: opsmind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsmind" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://opsmind:opsmind@localhost:5432/opsmind_test
    steps:
      - uses: actions/checkout@v5
      # The schema is owned by the API's migrations; apply them first.
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run migrate -w apps/api
        env: { JWT_SECRET: ci-secret-at-least-16-chars }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/requirements.txt
      - run: pip install -r services/ai/requirements.txt
      # Fails the job if hybrid Recall@5 drops below the threshold (calibrated for the hash embedder).
      - name: Evaluate retrieval (vector vs full text vs hybrid)
        working-directory: services/ai
        run: python -m eval.run_eval --out eval/results.md --min-recall 0.8
      - if: always()
        run: |
          if [ -f services/ai/eval/results.md ]; then
            cat services/ai/eval/results.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No retrieval report produced (setup likely failed)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-results
          path: |
            services/ai/eval/results.md
            services/ai/eval/results.json
          if-no-files-found: ignore

  browser:
    needs: [api, web, ai]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Each spec registers its own tenant from one runner IP; lift the per-IP login/register limit.
      AUTH_RATE_LIMIT: "0"
      AI_RATE_LIMIT: "0" # and the per-user AI limit, so repeated asks/exports by one test user never hit 429
      # Sandboxes on for the API and the web build (compose passes both), so tests/sandbox.spec.ts runs;
      # retries create more than one from the same IP.
      ALLOW_SANDBOX: "true"
      SANDBOX_RATE_LIMIT: "0"
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/docker-hub-mirror
      - run: docker compose up -d --build --wait postgres redis api ai worker web
      # The web image has no healthcheck, so --wait only means "started"; wait until Next.js answers.
      - name: Wait for the web app
        run: curl -fsS --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null "$WEB_URL/login"
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: e2e
        run: npx playwright test
      - name: README screenshots
        working-directory: e2e
        env: { SCREENSHOTS: "1" }
        run: npx playwright test
      - name: Seed the demo workspace
        run: docker compose exec -T -e DEMO_EMAIL=demo@opsmind.dev -e DEMO_PASSWORD=opsmind-demo api node dist/seedDemo.js
      - name: Record the demo tour
        working-directory: e2e
        env: { DEMO_VIDEO: "1", DEMO_EMAIL: demo@opsmind.dev, DEMO_PASSWORD: opsmind-demo }
        run: npx playwright test
      - name: Demo GIF
        # apt-get update first: the runner image's package lists can be stale, which makes a bare install 404.
        run: |
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          bash scripts/make-demo-gif.sh e2e/demo-video/tour.webm e2e/demo-video/demo.gif
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-gif
          path: |
            e2e/demo-video/demo.gif
            e2e/demo-video/demo-contact-sheet.png
            e2e/demo-video/tour.webm
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
      - if: failure()
        run: docker compose logs --no-color api worker ai web
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png
          if-no-files-found: ignore

  # The Codespaces setup (.devcontainer/start.sh + compose overlay) run straight on the runner, then
  # everything a visitor does, with every API call going through the web app's same-origin proxy on :3000.
  codespace:
    needs: [api, web, ai]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The browser specs register a tenant each, all from one runner IP; lift the per-IP login/register limit.
      AUTH_RATE_LIMIT: "0"
      AI_RATE_LIMIT: "0" # and the per-user AI limit, so repeated asks/exports by one test user never hit 429
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/docker-hub-mirror
      - name: Start the stack with the Codespaces overlay
        run: bash .devcontainer/start.sh
      - name: Starting again (a restarted codespace) is harmless
        run: bash .devcontainer/start.sh
      - name: Demo sign-in and API through the web origin
        run: |
          TOKEN=$(curl -fsS -X POST "$WEB_URL/api/v1/auth/login" -H 'content-type: application/json' \
            -d '{"email":"demo@opsmind.dev","password":"opsmind-demo"}' | jq -er .token)
          curl -fsS "$WEB_URL/api/v1/auth/me" -H "authorization: Bearer $TOKEN" | jq -e '.role == "viewer"'
          # The one-click button only renders when the demo login was baked into the build.
          curl -fsS "$WEB_URL/" | grep -q 'data-testid="demo-login"'
          # The browser bundle must call the API on its own origin, never a baked-in localhost:4000.
          docker compose exec -T web grep -rq '/api/v1' .next/static
          if docker compose exec -T web grep -rq 'localhost:4000' .next/static; then
            echo "web bundle still calls http://localhost:4000 directly" >&2
            exit 1
          fi
      - name: Smoke test through the proxy (upload, indexing, ask, xlsx/pdf exports)
        env: { API: http://localhost:3000 }
        run: bash scripts/smoke.sh
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: One-click demo in a real browser, same origin only
        working-directory: e2e
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from "@playwright/test";

          const web = new URL(process.env.WEB_URL).origin;
          const browser = await chromium.launch();
          const page = await browser.newPage();
          const offOrigin = [];
          page.on("request", (r) => {
            const url = new URL(r.url());
            if (url.pathname.startsWith("/api/") && url.origin !== web) offOrigin.push(r.url());
          });
          const dashboard = page.waitForResponse((r) => new URL(r.url()).pathname === "/api/v1/metrics/dashboard");
          await page.goto(web);
          await page.getByTestId("demo-login").click();
          await page.waitForURL("**/dashboard/analytics");
          const res = await dashboard;
          await browser.close();
          if (!res.ok()) throw new Error(`dashboard through the proxy: HTTP ${res.status()}`);
          if (offOrigin.length) throw new Error(`API called off-origin: ${offOrigin.join(", ")}`);
          console.log(`one-click demo ok: viewer signed in and dashboard loaded via ${web}`);
          EOF
      - name: Browser tests through the proxy
        working-directory: e2e
        run: npx playwright test # the @screenshots / @demo suites are opt-in and stay out
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: codespace-playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
      - if: failure()
        run: docker compose logs --no-color api worker ai web

  # The dev container exactly as Codespaces builds it (base image + docker-in-docker, vscode user).
  # `devcontainer up` runs postCreateCommand (build) and postStartCommand (start, seed, sign in through
  # the proxy), so this rehearses a real codespace start. Separate job so it runs in parallel.
  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Boot the dev container like a codespace
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            docker version --format 'docker {{.Server.Version}}' && docker compose version
            curl -fsS http://localhost:3000/ | grep -q 'data-testid="demo-login"'
      - name: Dev container logs
        if: failure()
        run: |
          for id in $(docker ps -aq --filter label=devcontainer.local_folder); do
            docker exec "$id" sh -c 'cd /workspaces/* && docker compose logs --no-color' || docker logs "$id"
          done

  # The serverless profile the Vercel demo runs (deploy/vercel), without Vercel: Postgres only (no Redis,
  # no worker), inline indexing, closed sign-up, hidden /metrics and the daily seed behind CRON_SECRET.
  # It also loads both entry points the way Vercel does.
  serverless:
    needs: [api, ai]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash # explicit bash adds -o pipefail
    services:
      postgres:
        image: mirror.gcr.io/pgvector/pgvector:pg16 # Docker Hub image via Google's mirror (rate limits)
        env:
          POSTGRES_USER: opsmind
          POSTGRES_PASSWORD: opsmind
          POSTGRES_DB: opsmind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsmind" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://opsmind:opsmind@localhost:5432/opsmind
      JWT_SECRET: ci-secret-at-least-16-chars
      AI_SERVICE_URL: http://localhost:8000/ # trailing slash on purpose: a pasted URL often has one
      AI_SERVICE_TOKEN: ci-internal-token-0123456789
      # api, as in deploy/vercel/README.md step 5 (no REDIS_URL, and no Redis service in this job)
      INGEST_MODE: inline
      ALLOW_REGISTRATION: "false"
      METRICS_PUBLIC: "false" # the ai service reads it too
      CRON_SECRET: ci-cron-secret-0123456789abcdef
      DEMO_EMAIL: demo@opsmind.dev
      DEMO_PASSWORD: opsmind-demo
      MAX_UPLOAD_BYTES: "4194304"
      PG_POOL_MAX: "3"
      TRUST_PROXY: "1"
      ALLOW_SANDBOX: "true"
      SANDBOX_RATE_LIMIT: "2" # low, so the sandbox step can reach the 429
      # ai, as in step 4
      DB_POOL_MAX: "2"
      DB_POOL_CHECK: "true"
      API: http://localhost:4000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w apps/api
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai/requirements.txt
      - run: pip install -r services/ai/requirements.txt

      - name: Entry points load the way Vercel loads them
        run: |
          jq -e . apps/api/vercel.json services/ai/vercel.json > /dev/null
          # api: vercel.json points Vercel at dist/, where it serves the default export of app.js.
          node --input-type=module -e '
            const { default: app } = await import("./apps/api/dist/app.js");
            if (typeof app !== "function" || typeof app.handle !== "function") {
              throw new Error("apps/api/dist/app.js has no Express app as its default export");
            }
            console.log("api entry ok");
            process.exit(0);
          '
          # ai: Vercel's Python runtime loads the top-level `app` of index.py.
          cd services/ai
          python -c 'from fastapi import FastAPI; from index import app; assert isinstance(app, FastAPI); print("ai entry ok")'

      - name: Migrations
        run: node apps/api/dist/lib/migrate.js

      - name: Start ai and api (no Redis, no worker)
        run: |
          (cd services/ai && nohup uvicorn index:app --port 8000 > "$RUNNER_TEMP/ai.log" 2>&1 &)
          nohup node apps/api/dist/server.js > "$RUNNER_TEMP/api.log" 2>&1 &
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8000/health
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null "$API/ready"

      - name: The daily seed needs CRON_SECRET, and a doubled delivery is harmless
        run: |
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(status "$API/api/internal/cron/seed")" = 401
          test "$(status -H 'authorization: Bearer wrong-secret' "$API/api/internal/cron/seed")" = 401
          seed() { curl -fsS --max-time 240 -H "authorization: Bearer $CRON_SECRET" "$API/api/internal/cron/seed"; }
          # Vercel Cron may deliver one run twice: start two at once on the empty database.
          seed > "$RUNNER_TEMP/seed-1.json" & one=$!
          seed > "$RUNNER_TEMP/seed-2.json" & two=$!
          wait "$one"
          wait "$two"
          jq -c . "$RUNNER_TEMP"/seed-*.json
          # One run created the 4 documents, the other found them, and both indexed inline (no worker).
          jq -s -e 'map(.documentsAdded) | sort == [0, 4]' "$RUNNER_TEMP"/seed-*.json
          jq -s -e 'all(.[]; .documentsFailed == 0)' "$RUNNER_TEMP"/seed-*.json
          # The next day's run: fresh KPIs, nothing to add or index.
          seed | jq -e '.documentsAdded == 0 and .documentsIndexed == 0 and .documentsFailed == 0 and .points > 0'

      - name: The demo visitor signs in, finds 4 indexed documents and gets a cited answer
        run: |
          TOKEN=$(curl -fsS -X POST "$API/api/v1/auth/login" -H 'content-type: application/json' \
            -d "{\"email\":\"$DEMO_EMAIL\",\"password\":\"$DEMO_PASSWORD\"}" | jq -er .token)
          AUTH="authorization: Bearer $TOKEN"
          curl -fsS "$API/api/v1/auth/me" -H "$AUTH" | jq -e '.role == "viewer"'
          # The seed already waited for inline indexing; poll briefly so a regression reads as a timeout.
          for i in $(seq 1 30); do
            curl -fsS "$API/api/v1/documents" -H "$AUTH" > "$RUNNER_TEMP/docs.json"
            jq -e '(.data | length) == 4 and all(.data[]; .status == "ready")' "$RUNNER_TEMP/docs.json" > /dev/null && break
            sleep 2
          done
          jq -e '(.data | length) == 4 and all(.data[]; .status == "ready" and .chunkCount > 0)' "$RUNNER_TEMP/docs.json"
          curl -fsS -X POST "$API/api/v1/ask" -H "$AUTH" -H 'content-type: application/json' \
            -d '{"question":"How many days do customers have to request a refund?"}' \
            | jq -e '(.answer | test("30")) and any(.citations[]; .cited and .title == "Refund and returns policy")'
          curl -fsS "$API/api/v1/metrics/dashboard?days=30" -H "$AUTH" | jq -e '.kpis | length == 6'
          curl -fsS "$API/api/v1/metrics/insights?days=30" -H "$AUTH" | jq -e '(.anomalies | length) > 0'
          curl -fsS "$API/api/v1/metrics/export?format=pdf&days=30" -H "$AUTH" -o "$RUNNER_TEMP/report.pdf"
          test "$(head -c 5 "$RUNNER_TEMP/report.pdf")" = "%PDF-"

      - name: An upload is indexed by the API process after its 202, and 4 MB is the cap
        run: |
          # Sign-up is closed, so put a member into the demo workspace directly (the next seed removes it).
          HASH=$(cd apps/api && node -e 'import("bcryptjs").then(({ default: b }) => console.log(b.hashSync("member-password", 10)))')
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v hash="$HASH" -v email="$DEMO_EMAIL" <<'SQL'
          INSERT INTO users (tenant_id, email, name, password_hash, role)
          SELECT tenant_id, 'ci-member@example.com', 'CI member', :'hash', 'member' FROM users WHERE email = :'email';
          SQL
          TOKEN=$(curl -fsS -X POST "$API/api/v1/auth/login" -H 'content-type: application/json' \
            -d '{"email":"ci-member@example.com","password":"member-password"}' | jq -er .token)
          AUTH="authorization: Bearer $TOKEN"
          printf 'Parking policy\n\nVisitors park on level 2 of the north garage.\nThe barrier opens with a staff badge after 18:00.\n' \
            > "$RUNNER_TEMP/parking.txt"
          ID=$(curl -fsS -X POST "$API/api/v1/documents" -H "$AUTH" -F "file=@$RUNNER_TEMP/parking.txt" | jq -er .id)
          for i in $(seq 1 30); do
            STATUS=$(curl -fsS "$API/api/v1/documents/$ID" -H "$AUTH" | jq -r .status)
            [ "$STATUS" = ready ] && break
            sleep 1
          done
          test "$STATUS" = ready
          head -c 4200000 /dev/zero | tr '\0' a > "$RUNNER_TEMP/too-big.txt"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API/api/v1/documents" -H "$AUTH" \
            -F "file=@$RUNNER_TEMP/too-big.txt")" = 413

      - name: Sandbox - create, index in the background, upload, ask with history, limits, expiry, cleanup
        run: |
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          json='content-type: application/json'
          curl -fsS -X POST "$API/api/v1/sandbox" > "$RUNNER_TEMP/sandbox.json"
          # 24 hours from now (jq's date parser does not take milliseconds).
          jq -e '(.token | length) > 20 and (.expiresAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) > (now + 23.9 * 3600)' \
            "$RUNNER_TEMP/sandbox.json"
          AUTH="authorization: Bearer $(jq -r .token "$RUNNER_TEMP/sandbox.json")"
          curl -fsS "$API/api/v1/auth/me" -H "$AUTH" > "$RUNNER_TEMP/sandbox-me.json"
          jq -e '.role == "owner" and .tenantName == "Sandbox workspace" and .expiresAt != null and (.email | endswith("@sandbox.invalid"))' \
            "$RUNNER_TEMP/sandbox-me.json"
          ME=$(jq -r .id "$RUNNER_TEMP/sandbox-me.json")
          TENANT=$(jq -r .tenantId "$RUNNER_TEMP/sandbox-me.json")

          # The 4 sample documents are indexed by the API process after the 201 (inline, no worker).
          for i in $(seq 1 60); do
            curl -fsS "$API/api/v1/documents" -H "$AUTH" > "$RUNNER_TEMP/sandbox-docs.json"
            jq -e '(.data | length) == 4 and all(.data[]; .status == "ready")' "$RUNNER_TEMP/sandbox-docs.json" > /dev/null && break
            sleep 2
          done
          jq -e '(.data | length) == 4 and all(.data[]; .status == "ready" and .chunkCount > 0)' "$RUNNER_TEMP/sandbox-docs.json"
          curl -fsS "$API/api/v1/metrics/dashboard?days=30" -H "$AUTH" | jq -e '.kpis | length == 6'

          # The visitor's own file, then a question about it and a follow-up carrying the history.
          printf 'Bike storage\n\nBicycles go in the locked room behind reception.\nThe door code changes every Monday.\n' \
            > "$RUNNER_TEMP/bikes.txt"
          ID=$(curl -fsS -X POST "$API/api/v1/documents" -H "$AUTH" -F "file=@$RUNNER_TEMP/bikes.txt" | jq -er .id)
          for i in $(seq 1 30); do
            STATUS=$(curl -fsS "$API/api/v1/documents/$ID" -H "$AUTH" | jq -r .status)
            [ "$STATUS" = ready ] && break
            sleep 1
          done
          test "$STATUS" = ready
          curl -fsS -X POST "$API/api/v1/ask" -H "$AUTH" -H "$json" -d '{"question":"Where do bicycles go?"}' \
            > "$RUNNER_TEMP/sandbox-ask.json"
          jq -e '(.answer | length) > 0 and any(.citations[]; .cited and .title == "bikes")' "$RUNNER_TEMP/sandbox-ask.json"
          jq -c '{question: "And when does the door code change?", history: [{question: "Where do bicycles go?", answer: .answer}]}' \
            "$RUNNER_TEMP/sandbox-ask.json" > "$RUNNER_TEMP/followup.json"
          curl -fsS -X POST "$API/api/v1/ask" -H "$AUTH" -H "$json" -d "@$RUNNER_TEMP/followup.json" | jq -e '(.answer | length) > 0'
          # More than 4 turns is refused before any AI call.
          test "$(status -X POST "$API/api/v1/ask" -H "$AUTH" -H "$json" \
            -d "$(jq -nc '{question: "q", history: [range(5) | {question: "q", answer: "a"}]}')")" = 400

          # A sandbox cannot add people or change roles.
          test "$(status -X POST "$API/api/v1/users" -H "$AUTH" -H "$json" \
            -d '{"name":"Eve","email":"eve@example.com","password":"password123","role":"admin"}')" = 403
          test "$(status -X PATCH "$API/api/v1/users/$ME/role" -H "$AUTH" -H "$json" -d '{"role":"viewer"}')" = 403

          # SANDBOX_RATE_LIMIT=2 per IP per hour: the second is fine, the third is refused.
          test "$(status -X POST "$API/api/v1/sandbox")" = 201
          test "$(status -X POST "$API/api/v1/sandbox")" = 429

          # Expired: the token stops working at once, and the daily cron deletes the workspace and its data.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE tenants SET expires_at = now() - interval '1 minute' WHERE id = '$TENANT'"
          test "$(status "$API/api/v1/documents" -H "$AUTH")" = 401
          curl -s "$API/api/v1/documents" -H "$AUTH" | jq -e '.error == "sandbox expired"'
          curl -fsS --max-time 240 -H "authorization: Bearer $CRON_SECRET" "$API/api/internal/cron/seed" \
            | jq -e '.sandboxesDeleted >= 1 and .documentsFailed == 0'
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM tenants WHERE id = '$TENANT'")" = 0
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM documents WHERE tenant_id = '$TENANT'")" = 0
          # The other (unexpired) sandbox and the demo workspace stay.
          test "$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM tenants WHERE expires_at > now()")" = 1
          curl -fsS -X POST "$API/api/v1/auth/login" -H "$json" \
            -d "{\"email\":\"$DEMO_EMAIL\",\"password\":\"$DEMO_PASSWORD\"}" | jq -e '.token | length > 0'

      - name: Public-deploy switches
        run: |
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(status -X POST "$API/api/v1/auth/register" -H 'content-type: application/json' \
            -d '{"tenantName":"Acme","name":"Ann","email":"ann@acme.io","password":"password123"}')" = 403
          curl -s -X POST "$API/api/v1/auth/register" -H 'content-type: application/json' -d '{}' \
            | jq -e '.error | test("registration is disabled")'
          test "$(status "$API/metrics")" = 404
          test "$(status http://localhost:8000/metrics)" = 404

      - if: failure()
        run: |
          echo "::group::api log"; cat "$RUNNER_TEMP/api.log" || true; echo "::endgroup::"
          echo "::group::ai log"; cat "$RUNNER_TEMP/ai.log" || true; echo "::endgroup::"

  # The static interactive preview (what the Preview workflow publishes to SourceCraft Sites), without
  # publishing: recorded from the real stack, exported as plain files, and driven in a browser with no API.
  preview:
    needs: [api, web, ai]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The recorder asks up to 9 questions and pulls 4 insights and 2 exports as one user.
      AI_RATE_LIMIT: "0"
      DEMO_EMAIL: demo@opsmind.dev
      DEMO_PASSWORD: opsmind-demo
      PREVIEW_BASE_PATH: /opsmind
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/docker-hub-mirror
      - run: docker compose up -d --build --wait postgres redis api ai worker
      - name: Seed the demo workspace
        run: docker compose exec -T -e DEMO_EMAIL=demo@opsmind.dev -e DEMO_PASSWORD=opsmind-demo api node dist/seedDemo.js
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Record the preview data (waits until the demo documents are indexed)
        run: node scripts/record-preview.mjs
      - name: Build the static preview
        env: { STATIC_PREVIEW: "1", NEXT_PUBLIC_PREVIEW: "1" }
        run: npm run build -w apps/web
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Smoke test the static site (banner, demo, analytics, ask in EN/RU, Arabic, no /api/ requests)
        run: node apps/web/preview-smoke.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-preview
          path: apps/web/out/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --no-color api worker ai
