apiVersion: 1

# Fixed uids: the dashboard JSON references datasources by uid only, so it is portable
# across Grafana instances as long as these two uids exist.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Must match the scrape interval so $__rate_interval never spans fewer than 4 samples.
      timeInterval: 15s
      httpMethod: POST

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
