apiVersion: 1

providers:
  - name: opsmind
    folder: OpsMind
    type: file
    # Dashboards live in git; UI edits would be silently overwritten on the next reload.
    allowUiUpdates: false
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
